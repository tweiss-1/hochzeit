<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Hochzeit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1 id="paar_namen">Laden...</h1>
        <p class="date" id="datum"></p>
    </header>

    <main class="content">
        <section>
            <p id="einleitungstext" class="lead"></p>
        </section>

        <section class="location">
            <h2>Der Ort</h2>
            <p><strong id="location_name"></strong></p>
            <p id="location_adresse"></p>

        <section class="rsvp">
            <h2>Zusage</h2>
            <p>Bitte gebt uns bis zum <span id="rsvp_frist"></span> Bescheid.</p>
        </section>
    </main>

    <!-- Das Skript, das die Daten einfügt -->
    <script src="script.js"></script>
</body>
</html>
