<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Hochzeit – Kathi & Thomas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Segoe+UI:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Menüband -->
    <header class="site-header">
        <div class="header-container">
            <a href="#welcome" class="header-logo" data-content="paar_namen">Laden...</a>
            <nav class="site-nav">
                <a href="#welcome">Welcome</a>
                <a href="#location">Location</a>
                <a href="#fotos">Fotos</a>
                <a href="#kulinarik">Kulinarik</a>
                <a href="#infos">Infos</a>
            </nav>
        </div>
    </header>

    <main style="max-width: none; padding: 0;">

        <!-- 1. Welcome / Startseite (Mit Hintergrundbild) -->
        <section id="welcome" class="hero-section" style="background-image: url('watermarked_img_6513407295372902831.jpg');">
            <div class="hero-content">
                <h1 data-content="paar_namen">Laden...</h1>
                <p class="date" data-content="datum" style="letter-spacing: 3px; text-transform: uppercase; font-size: 1rem; color: #E5DCD5;"></p>
                <p data-content="einleitungstext" style="font-size: 1.3rem; margin-top: 1.5rem;"></p>
            </div>
        </section>

        <!-- 2. Location (Mit Hintergrundbild) 
        <section id="location" class="hero-section" style="background-image: url(images/schloss-ottersbach.jpg);">
            <div class="hero-content">
                <h2>Die Location</h2>
                <p style="font-size: 1.4rem; font-weight: bold;" data-content="location_name"></p>
                <p data-content="location_adresse"></p>
                <p data-content="location_details" style="margin-top: 1rem; font-style: italic;"></p>
            </div>
        </section> -->

        <!-- 2. Location (Mit Hintergrund-Video) -->
        <section id="location" class="hero-section video-section">
            <!-- Das Video-Element -->
            <video autoplay muted loop playsinline class="bg-video">
                <source src="images/location.mp4" type="video/mp4">
                Dein Browser unterstützt kein Video.
            </video>

            <!-- Der Textinhalt (wird dank z-index über das Video gelegt) -->
            <div class="hero-content">
                <h2>Die Location</h2>
                <p style="font-size: 1.4rem; font-weight: bold;" data-content="location_name"></p>
                <p data-content="location_adresse"></p>
                <p data-content="location_details" style="margin-top: 1rem; font-style: italic;"></p>
            </div>
        </section>

        <!-- 3. Fotos -->
        <section id="fotos" class="hero-section" style="background-image: url('watermarked_img_845686807046819129.jpg');">
            <div class="hero-content">
                <h2>Eindrücke & Fotos</h2>
                <p data-content="fotos_text"></p>
                <p style="font-weight: bold; margin-top: 1rem;" data-content="fotos_hinweis"></p>
            </div>
        </section>

        <!-- 4. Kulinarik (Mit Hintergrundbild) -->
        <section id="kulinarik" class="hero-section" style="background-image: url(images/kulinarik.jpg);">
            <div class="hero-content">
                <h2>Kulinarik</h2>
                <p data-content="kulinarik_text" style="font-size: 1.2rem;"></p>
            </div>
        </section>

        <!-- 5. Infos & FAQ (Als klassische, saubere Box auf hellem Hintergrund) -->
        <section id="infos" class="info-section">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2>Wichtige Infos</h2>
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <h3>Dresscode</h3>
                    <p data-content="info_dresscode"></p>
                </div>
                <div class="info-item">
                    <h3>Geschenke</h3>
                    <p data-content="info_geschenke"></p>
                </div>
                <div class="info-item">
                    <h3>Rückmeldung (RSVP)</h3>
                    <p>Bitte gebt uns bis zum <span data-content="rsvp_frist" style="font-weight: bold; color: var(--primary);"></span> Bescheid.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 – <span data-content="paar_namen"></span> | Wir freuen uns auf euch!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
